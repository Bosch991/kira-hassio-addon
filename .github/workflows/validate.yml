name: Validate add-on

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-addon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Home Assistant configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate add-on metadata
        uses: frenck/action-addon-linter@f995494fd84fae6310d23617e66d0e37de4f14eb # v2
        with:
          path: ./kira

  image:
    name: Build amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kira/requirements-addon.txt

      - name: Audit runtime dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r kira/requirements-addon.txt --progress-spinner off

      - name: Build image
        run: docker build --tag kira-addon:test ./kira

      - name: Compile packaged sources
        run: >-
          docker run --rm --entrypoint /opt/kira-venv/bin/python
          kira-addon:test -m compileall -q /opt/kira/src
