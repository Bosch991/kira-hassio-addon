configuration:
  openai_api_key:
    name: OpenAI API Key
    description: API-Key fuer freie Kira-Gespraeche und Assist-Antworten.
  openai_model:
    name: OpenAI Modell
    description: Modellname, den Kira fuer Antworten nutzt.
  agent_semantic_enabled:
    name: Semantischer Kira Agent
    description: Nutzt OpenAI fuer strukturierte Absichtserkennung mit lokalem Fallback.
  agent_confirmation_seconds:
    name: Bestaetigungszeit
    description: Sekunden, nach denen ein ausstehender sicherheitsrelevanter Plan ablaeuft.
  agent_verification_attempts:
    name: Pruefversuche
    description: Anzahl begrenzter State-Pruefungen nach einer Aktion.
  agent_verification_delay:
    name: Pruefintervall
    description: Wartezeit in Sekunden zwischen State-Pruefungen.
  proactive_mode:
    name: Proaktiver Modus
    description: Erkennen, vorschlagen oder vorbereiteter Ausfuehrungsmodus.
  proactive_auto_execute:
    name: Proaktive Ausfuehrung
    description: Bleibt ohne zusaetzliche Allowlist wirkungslos und ist standardmaessig aus.
  kira_api_token:
    name: Kira API Token
    description: Bearer Token fuer Home Assistant Assist POST /assist.
  elevenlabs_api_key:
    name: ElevenLabs API Key
    description: Optionaler API-Key fuer Kira-Sprachausgabe.
  elevenlabs_voice_id:
    name: ElevenLabs Voice ID
    description: Stimme, die Kira fuer TTS nutzt.
  default_media_player:
    name: Standard media_player
    description: Optionales Home-Assistant-Ausgabegeraet fuer Kira-Sprachausgabe.
  media_base_url:
    name: Media Base URL
    description: Erreichbare URL des Kira-Mediaservers, z. B. http://HA-IP:8765.
  log_level:
    name: Log Level
    description: Detailgrad der lokalen Kira-Logs.
  live_notifications:
    name: Live Events
    description: Aktiviert vorbereitete Home-Assistant-Live-Event-Hinweise.
